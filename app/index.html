<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --accent: var(--tg-theme-button-color, #2f80ed);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 16px 16px 8px; }
  h1 { margin: 0 0 12px; font-size: 22px; }
  .search {
    width: 100%; padding: 10px 12px; border: 0; border-radius: 10px;
    background: var(--bg); color: var(--text); font-size: 15px; outline: none;
  }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px; scrollbar-width: none; }
  .chip {
    flex: none; border: 0; border-radius: 16px; padding: 6px 14px;
    background: var(--bg); color: var(--text); font-size: 14px; cursor: pointer;
  }
  .chip.active { background: var(--accent); color: var(--accent-text); }
  main { padding: 8px 16px 24px; display: grid; gap: 10px; }
  .card {
    display: flex; gap: 12px; align-items: center; padding: 12px;
    background: var(--bg); border-radius: 14px; cursor: pointer;
  }
  .icon {
    flex: none; width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center;
    background: var(--bg2); font-size: 26px;
  }
  .card .title { font-weight: 600; }
  .meta { color: var(--hint); font-size: 13px; }
  .price { margin-left: auto; font-weight: 600; white-space: nowrap; }
  .empty { text-align: center; color: var(--hint); padding: 40px 0; }
  .detail { display: none; padding: 16px; }
  .detail .icon { width: 72px; height: 72px; font-size: 40px; background: var(--bg); }
  .detail h2 { margin: 14px 0 4px; font-size: 20px; }
  .detail .box { background: var(--bg); border-radius: 14px; padding: 14px; margin-top: 14px; }
  .detail .big { font-size: 22px; font-weight: 700; }
  body.show-detail .list-view { display: none; }
  body.show-detail .detail { display: block; }
</style>
</head>
<body>
<div class="list-view">
  <header>
    <h1>Project Hub</h1>
    <input class="search" id="search" type="search" placeholder="Поиск темы">
  </header>
  <div class="chips" id="chips"></div>
  <main id="list"><div class="empty">Загрузка…</div></main>
</div>
<section class="detail" id="detail"></section>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

let projects = [];
let category = 'Все';
let current = null;
const $ = id => document.getElementById(id);
const price = p => p.toLocaleString('ru-RU') + ' ₸';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);

function renderChips() {
  const cats = ['Все', ...new Set(projects.map(p => p.category))];
  $('chips').innerHTML = cats.map(c =>
    `<button class="chip${c === category ? ' active' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
}

function renderList() {
  const q = $('search').value.trim().toLowerCase();
  const items = projects.filter(p =>
    (category === 'Все' || p.category === category) &&
    (p.title + ' ' + p.description).toLowerCase().includes(q));
  $('list').innerHTML = items.length ? items.map(p => `
    <div class="card" data-id="${p.id}">
      <div class="icon">${esc(p.emoji)}</div>
      <div><div class="title">${esc(p.title)}</div><div class="meta">${esc(p.category)}</div></div>
      <div class="price">${price(p.price)}</div>
    </div>`).join('') : '<div class="empty">Ничего не найдено</div>';
}

function openDetail(p) {
  current = p;
  $('detail').innerHTML = `
    <div class="icon">${esc(p.emoji)}</div>
    <h2>${esc(p.title)}</h2>
    <div class="meta">${esc(p.category)}</div>
    <div class="box">${esc(p.description)}</div>
    <div class="box"><div class="meta">Цена</div><div class="big">${price(p.price)}</div></div>`;
  document.body.classList.add('show-detail');
  window.scrollTo(0, 0);
  tg?.BackButton.show();
  tg?.MainButton.setText('Оставить заявку').show();
}

function closeDetail() {
  current = null;
  document.body.classList.remove('show-detail');
  tg?.BackButton.hide();
  tg?.MainButton.hide();
}

async function order() {
  if (!current) return;
  if (!tg?.initData) return alert('Откройте приложение из Telegram-бота');
  tg.MainButton.showProgress();
  try {
    const res = await fetch('/api/order', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({initData: tg.initData, projectId: current.id}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Ошибка');
    tg.HapticFeedback?.notificationOccurred('success');
    tg.showAlert('Заявка отправлена! Подробности — в чате с ботом.', () => tg.close());
  } catch (e) {
    tg.showAlert(e.message || 'Не удалось отправить заявку');
  } finally {
    tg.MainButton.hideProgress();
  }
}

$('chips').addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (!c) return;
  category = c.dataset.cat;
  renderChips();
  renderList();
});
$('list').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) openDetail(projects.find(p => p.id === Number(card.dataset.id)));
});
$('search').addEventListener('input', renderList);
tg?.BackButton.onClick(closeDetail);
tg?.MainButton.onClick(order);

fetch('/api/projects').then(r => r.json()).then(data => {
  projects = data;
  renderChips();
  renderList();
}).catch(() => { $('list').innerHTML = '<div class="empty">Не удалось загрузить каталог</div>'; });
</script>
</body>
</html>
